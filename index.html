function chart(days,get,max,col){var W=560,H=96,L=26,Rr=8,T=8,B=18,w=W-L-Rr,h=H-T-B,n=days.length;
 function X(i){return L+(n>1?i*w/(n-1):w/2)}function Y(v){return T+h-v/max*h}
 var s='<svg viewBox="0 0 '+W+" "+H+'" width="100%" role="img">',p="",c="";
 [0,max/2,max].forEach(function(g){s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="#EAE4F0"/><text x="2" y="'+(Y(g)+4)+'" font-size="11" fill="#7A7288">'+Math.round(g)+"</text>"});
 var pen=0;days.forEach(function(d,i){var v=get(d);if(v===null||v===undefined){pen=0;return}p+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)+" ";pen=1;c+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.5" fill="'+col+'"/>'});
 s+='<path d="'+p+'" fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round"/>'+c;
 function lb(d){return d.slice(8)+"-"+d.slice(5,7)}
 s+='<text x="'+L+'" y="'+(H-3)+'" font-size="11" fill="#7A7288">'+lb(days[0])+'</text><text x="'+(W-Rr)+'" y="'+(H-3)+'" font-size="11" text-anchor="end" fill="#7A7288">'+lb(days[n-1])+"</text></svg>";return s}

 var wc=[0,0,0,0,0,0,0],dc=[0,0,0];ps.forEach(function(p){wc[wd(pd(p.ts.slice(0,10)))]++;var u=+p.ts.slice(11,13);dc[u<12?0:u<18?1:2]++});

 $("#cs").innerHTML=h}
