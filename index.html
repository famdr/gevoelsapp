<style>
*{box-sizing:border-box}
body{margin:0;background:#FFFBFD;color:#4A4458;font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.w{max-width:620px;margin:0 auto;padding:18px 18px 40px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:22px;font-weight:500;margin:0;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.nv{border:1.5px solid #D9D2E0;background:#fff;border-radius:14px;padding:10px 16px;font-size:15px}
.l{font-size:13px;color:#7A7288;margin:0 0 6px}
.row{display:flex;gap:6px;margin-bottom:14px}
.dy{flex:1;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.mm{flex:1;height:84px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:500;cursor:pointer;user-select:none}
.mm i{font-style:normal;display:flex}.cn{display:flex;align-items:center;gap:8px}.kl{display:flex;align-items:center;justify-content:center;gap:10px}.kl svg{display:block}
.fr{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.ic{width:58px;height:58px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px}
.pb{touch-action:none;position:relative;height:44px;margin:0 17px;cursor:pointer}
.tr{position:absolute;left:0;right:0;top:16px;height:12px;border-radius:6px}
.fl{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.th{position:absolute;top:22px;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500}
.tk{position:relative;height:16px;margin:-2px 17px 0;font-size:12px;color:#7A7288}
.tk span{position:absolute;transform:translateX(-50%)}
.sec{border-top:.5px solid #E6DFEC;margin-top:18px;padding-top:16px}
#dn{width:110px;height:58px;border-radius:14px;border:1.5px solid #B9AEDF;background:#fff;color:inherit;font:500 30px system-ui;text-align:center}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cb{border:.5px solid #D9D2E0;border-radius:16px;padding:10px 12px;background:#fff}
.cb div:first-child{margin-bottom:8px;font-size:15px}
.yn{display:flex;gap:8px}
.yn b{flex:1;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:500;background:#fff;border:1px solid #E6DFEC;cursor:pointer;user-select:none}
textarea,input[type=text],input[type=password]{width:100%;border-radius:14px;border:.5px solid #D9D2E0;background:#fff;color:inherit;padding:12px 14px;font:15px system-ui;resize:none}
.pz{height:84px;border-radius:16px;background:#F9CFE0;border:1.5px solid #E9A5C2;color:#6B2342;display:flex;align-items:center;justify-content:center;gap:14px;font-size:18px;font-weight:500;width:100%;margin-top:22px}
.pz img{width:64px;height:64px;border-radius:50%;border:2px solid #E9A5C2;object-fit:cover}
.kl{height:76px;border-radius:999px;background:#CDEBD3;border:1.5px solid #8FCB9B;color:#1F5A33;font-size:24px;font-weight:500;width:100%;margin-top:12px}
.pz:active,.kl:active{transform:scale(.98)}
.ch{margin-bottom:12px}
