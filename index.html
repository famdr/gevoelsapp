<style>
*{box-sizing:border-box}
body{margin:0;background:#FFFBFD;color:#4A4458;font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.w{max-width:620px;margin:0 auto;padding:18px 18px 40px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:22px;font-weight:500;margin:0;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.nv{border:1.5px solid #D9D2E0;background:#fff;border-radius:14px;padding:10px 16px;font-size:15px}
.l{font-size:13px;color:#7A7288;margin:0 0 6px}
.row{display:flex;gap:6px;margin-bottom:14px}
.dy{flex:1;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.mm{flex:1;height:84px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:500;cursor:pointer;user-select:none}
.mm i{font-style:normal;display:flex}.cn{display:flex;align-items:center;gap:8px}.kl{display:flex;align-items:center;justify-content:center;gap:10px}.kl svg{display:block}
.fr{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.ic{width:58px;height:58px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px}
.pb{touch-action:none;position:relative;height:44px;margin:0 17px;cursor:pointer}
.tr{position:absolute;left:0;right:0;top:16px;height:12px;border-radius:6px}
.fl{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.th{position:absolute;top:22px;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500}
.tk{position:relative;height:16px;margin:-2px 17px 0;font-size:12px;color:#7A7288}
.tk span{position:absolute;transform:translateX(-50%)}
.sec{border-top:.5px solid #E6DFEC;margin-top:18px;padding-top:16px}
#dn{width:110px;height:58px;border-radius:14px;border:1.5px solid #B9AEDF;background:#fff;color:inherit;font:500 30px system-ui;text-align:center}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cb{border:.5px solid #D9D2E0;border-radius:16px;padding:10px 12px;background:#fff}
.cb div:first-child{margin-bottom:8px;font-size:15px}
.yn{display:flex;gap:8px}
.yn b{flex:1;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:500;background:#fff;border:1px solid #E6DFEC;cursor:pointer;user-select:none}
textarea,input[type=text],input[type=password]{width:100%;border-radius:14px;border:.5px solid #D9D2E0;background:#fff;color:inherit;padding:12px 14px;font:15px system-ui;resize:none}
.pz{height:84px;border-radius:16px;background:#F9CFE0;border:1.5px solid #E9A5C2;color:#6B2342;display:flex;align-items:center;justify-content:center;gap:14px;font-size:18px;font-weight:500;width:100%;margin-top:22px}
.pz img{width:64px;height:64px;border-radius:50%;border:2px solid #E9A5C2;object-fit:cover}
.kl{height:76px;border-radius:999px;background:#CDEBD3;border:1.5px solid #8FCB9B;color:#1F5A33;font-size:24px;font-weight:500;width:100%;margin-top:12px}
.pz:active,.kl:active{transform:scale(.98)}
.ch{margin-bottom:12px}

function drawInsights(P,rec,bas){
 var h="";
 if(!bas)h='<div class="osum">Bij "Alles" is er geen eerdere periode om mee te vergelijken. Kies een kortere periode.</div>';
 else{
  var st=afwStats(rec,bas),rows="",fl=[];
  st.forEach(function(x){
   if(x.none){rows+=rowHTML(x.m,0,1,false,"te weinig data");return;}
   if(x.flag)fl.push(M[x.m][0]+" ("+(x.d>0?"hoger":"lager")+")");
   rows+=rowHTML(x.m,x.d,x.m===0?8:4,x.flag,"normaal "+nf(x.mb)+"<br>nu "+nf(x.ma)+" "+(x.d>0.05?"↑":x.d<-0.05?"↓":"→"));
  });
  h='<div class="osum">'+(rec.length<3?"Te weinig dagen om te vergelijken.":(fl.length?"Anders dan normaal: <b>"+fl.join(", ")+"</b>.":"Alles ligt dicht bij haar eigen normaal."))+'</div>'+axisHint("lager dan normaal","hoger dan normaal")+rows;
  h+='<div class="ocap">Vergeleken met de 28 dagen ervoor ('+bas.length+' dagen ingevuld). Gekleurd = groter verschil dan toeval. Dit zegt niets over goed of slecht.</div>';
 }
 $("b3").innerHTML=h;
 var by=[[],[],[],[],[],[],[]];rec.forEach(function(e){by[wd(e[0])].push(e);});
 var pz=PZ.filter(function(d){return d>=P.s&&d<=P.last;}),pc=[0,0,0,0,0,0,0];pz.forEach(function(d){pc[wd(d)]++;});
 var pmax=Math.max(1,Math.max.apply(null,pc));
 h='<div class="ogrid"><div></div>'+WD.map(function(w,i){return '<div class="ohd" style="background:'+WC[i]+'">'+w+'</div>';}).join("")+'<div class="ohd" style="background:#EFE9F7">alle</div>';
 for(var m=0;m<10;m++){
  h+='<div class="olab" style="font-size:13px"><span class="odot" style="background:'+M[m][1]+'"></span>'+M[m][0]+'</div>';
  var all=vals(rec,m);
  for(var w=0;w<7;w++){var a=vals(by[w],m);if(!a.length){h+='<div class="ocell" style="background:#F6F2F9">–</div>';continue;}var v=mean(a),tt=m===0?v/20:v/10;h+='<div class="ocell" style="background:'+(v===0?"#E3DDE8":rgba(M[m][1],.15+.85*Math.min(tt,1)))+'">'+nf(v)+'</div>';}
  h+='<div class="ocell" style="background:#F3EEFA;color:#7A7288">'+(all.length?nf(mean(all)):"–")+'</div>';
 }
 h+='<div class="olab" style="font-size:13px"><span class="odot" style="background:#E58BB0"></span>Poppiepauzes</div>';
 for(var w2=0;w2<7;w2++)h+='<div class="ocell" style="background:'+(pc[w2]===0?"#E3DDE8":rgba("#E58BB0",.15+.85*pc[w2]/pmax))+'">'+pc[w2]+'</div>';
 h+='<div class="ocell" style="background:#F3EEFA;color:#7A7288">'+pz.length+'</div><div class="olab" style="font-size:12px;color:#7A7288">dagen ingevuld</div>';
 for(var w3=0;w3<7;w3++)h+='<div class="ocell" style="font-size:11px;color:#7A7288;height:20px">'+by[w3].length+'</div>';
 h+='<div class="ocell" style="font-size:11px;color:#7A7288;height:20px">'+rec.length+'</div></div><div class="ocap">Gemiddelde per weekdag. Donkerder = hoger. '+(P.n<28?'In een korte periode zijn het per weekdag maar een of twee dagen. Kies 30 dagen of Alles voor een beter beeld.':'Het zijn per weekdag weinig dagen, dus zie het als een eerste indruk.')+'</div>';
 $("b4").innerHTML=h;
 var ja=rec.filter(function(e){return e[3][CXI]===1;}),nee=rec.filter(function(e){return e[3][CXI]===0;}),onb=rec.length-ja.length-nee.length,rows2="",fl2=[];
 for(var m3=0;m3<10;m3++){
  var a2=vals(ja,m3),b2=vals(nee,m3);
  if(a2.length<2||b2.length<2){rows2+=rowHTML(m3,0,1,false,"te weinig data");continue;}
  var d=mean(a2)-mean(b2),den=Math.sqrt(Math.pow(sd(a2),2)/a2.length+Math.pow(sd(b2),2)/b2.length),t=den>0?d/den:0,flag=a2.length>=5&&b2.length>=5&&Math.abs(t)>=2;
  if(flag)fl2.push(M[m3][0]+" ("+(d>0?"hoger":"lager")+")");
  rows2+=rowHTML(m3,d,m3===0?8:4,flag,"zonder "+nf(mean(b2))+"<br>met "+nf(mean(a2)));
 }
 h='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;" id="cxc">'+chipsH(CXN.map(function(c,i){return [String(i),c[0],c[1]];}),String(CXI))+'</div>';
 h+='<div class="osum" style="margin-top:12px">Met '+CXN[CXI][0].toLowerCase()+': '+ja.length+' dagen. Zonder: '+nee.length+'.'+(onb?" "+onb+" niet ingevuld.":"")+' '+(fl2.length?"Verschil bij: <b>"+fl2.join(", ")+"</b>.":"Geen duidelijk verschil.")+'</div>'+axisHint("lager op dagen met","hoger op dagen met")+rows2+'<div class="ocap">Gekleurd = groter verschil dan toeval. Het laat een samenhang zien, geen oorzaak.</div>';
 $("b5").innerHTML=h;
 bind($("cxc"),function(k){CXI=+k;draw(true);});
}
function draw(keep){
 load();
 var nv=$("nv"),body=$("ovb");
 if(!DATA.length){$("rg").innerHTML="";nv.style.display="none";body.hidden=true;$("smm").innerHTML="Nog niets ingevuld. Zodra er dagen zijn ingevuld, staat hier het overzicht.";return;}
 body.hidden=false;
 var P=per(),rec=inP(P),bas=baseOf(P);
 $("rg").innerHTML=chipsH([["d30","Afgelopen 30 dagen"],["week","Week"],["maand","Maand"],["alles","Alles"]],R);
 bind($("rg"),function(k){R=k;OFF=0;SEL=null;SROW=null;draw();});
 if(R==="week"||R==="maand"){
  nv.style.display="flex";
  nv.innerHTML='<div class="ochip'+(P.s<=first()?" off":"")+'" id="pv">‹</div><div style="font-size:15px;min-width:170px;text-align:center;">'+P.lab+'</div><div class="ochip'+(OFF===0?" off":"")+'" id="nx">›</div>';
  $("pv").addEventListener("click",function(){OFF--;SEL=null;SROW=null;draw();});
  $("nx").addEventListener("click",function(){OFF++;SEL=null;SROW=null;draw();});
 }else{nv.style.display="block";nv.innerHTML='<div style="font-size:13px;color:#7A7288;">'+P.lab+'</div>';}
 summary(P,rec,bas);
 $("an").innerHTML=ANK.map(function(a){return '<div class="ochip" data-k="'+a[0]+'">'+a[1]+'</div>';}).join("");
 bind($("an"),function(k){$(k).scrollIntoView({behavior:"smooth",block:"start"});});
 $("sg").innerHTML=chipsH([["cap","Schaal tot 20"],["all","Alles tonen"]],CAP?"cap":"all");
 bind($("sg"),function(k){CAP=(k==="cap");draw(true);});
 $("cg").innerHTML=chipsH([["a","Kleur per gevoel"],["b","Grijs, rood, geel, groen"]],SCH);
 bind($("cg"),function(k){SCH=k;draw(true);});
 drawChart(P,keep);
 drawInsights(P,rec,bas);
}

nav.innerHTML=ic("chartline",26,"#4A4458");bk.innerHTML=ic("arrowleft",22,"#4A4458");

/* ouderspaneel: lang indrukken op de titel */
var lp;$("#ttl").onpointerdown=function(){lp=setTimeout(function(){$("#cu").value=D.c.url||"";$("#ck").value=D.c.tok||"";$("#pn").hidden=false},1500)};
["pointerup","pointerleave","pointercancel"].forEach(function(ev){$("#ttl").addEventListener(ev,function(){clearTimeout(lp)})});
$("#sl2").onclick=function(){$("#pn").hidden=true};
function st(t){$("#ss").textContent=t}
$("#sv").onclick=function(){D.c.url=$("#cu").value.trim();D.c.tok=$("#ck").value.trim();sv();sync()};
function merge(es,ps){(es||[]).forEach(function(x){var o=D.e[x.datum];if(x.datum&&(!o||(o.gewijzigd_op||"")<(x.gewijzigd_op||"")))D.e[x.datum]=x});var ids={};D.p.forEach(function(p){ids[p.id]=1});(ps||[]).forEach(function(p){if(p.id&&!ids[p.id]){D.p.push(p);ids[p.id]=1}});sv()}
function sync(){var c=D.c;if(!c.url||!c.tok){st("Nog niet ingesteld");return Promise.resolve()}st("Bezig…");
 return fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:c.tok,e:Object.keys(D.e).map(function(k){return D.e[k]}),p:D.p})}).then(function(r){return r.json()}).then(function(j){if(!j||!j.ok)throw 0;merge(j.e,j.p);var n=new Date();st("Gesynchroniseerd om "+pad(n.getHours())+":"+pad(n.getMinutes()));if(!$("#v2").hidden)OV.draw()}).catch(function(){st("Synchroniseren lukt nu niet. De gegevens staan veilig op dit apparaat.")})}
window.addEventListener("online",sync);
function dl(n,t,m){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
$("#ej").onclick=function(){dl("gevoelsapp-"+ymd(new Date())+".json",JSON.stringify({e:Object.keys(D.e).map(function(k){return D.e[k]}),p:D.p}),"application/json")};
$("#ec").onclick=function(){function q(v){v=v===null||v===undefined?"":String(v);if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'}
 var r=[HEAD.join(",")];Object.keys(D.e).sort().forEach(function(k){r.push(HEAD.map(function(h){return q(D.e[k][h])}).join(","))});
 r.push("");r.push("id,ts,device_id");D.p.forEach(function(p){r.push([p.id,p.ts,p.device].map(q).join(","))});dl("gevoelsapp-"+ymd(new Date())+".csv",r.join("\n"),"text/csv")};
$("#im").onclick=function(){$("#fi").click()};
$("#fi").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);merge(j.e,j.p);st("Import gelukt");if(!$("#v2").hidden)OV.draw()}catch(x){st("Dit bestand kan niet gelezen worden.")}};r.readAsText(f);this.value=""};
$("#i123").innerHTML=ic("n123",34,"#4A4458");$("#ick").innerHTML=ic("check",30,"#1F5A33");
fresh();sync();
